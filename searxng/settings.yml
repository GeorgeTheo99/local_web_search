use_default_settings:
  engines:
    keep_only:
      - google cse
      - duckduckgo
      - bing
      - startpage
      - mwmbl
      - wikipedia
      - github
      - arxiv

general:
  instance_name: "Local SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - html
    - json

server:
  secret_key: "searxng-local-secret-key-change-me"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  image_proxy: true

outgoing:
  # Realistic rotating user agents reduce bot-blocks from upstream engines.
  # SearXNG rotates through these per request.
  useragent_suffix: ""
  request_timeout: 5.0
  retries: 0
  pool_connections: 100
  pool_maxsize: 20

engines:
  # Broad indexes verified from this host. Keep the custom defensive Mwmbl
  # adapter; upstream defaults provide the other implementations.
  - name: google cse
    disabled: false
  - name: duckduckgo
    disabled: false
  - name: bing
    disabled: false
  - name: startpage
    disabled: false
  - name: mwmbl
    engine: mwmbl_safe
    shortcut: mwm
    weight: 0.7
    timeout: 5.0
    disabled: false
  # Focused knowledge and research indexes.
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: arxiv
    disabled: false
