use_default_settings:
  engines:
    keep_only:
      - bing
      - mwmbl
      - wikipedia
      - github
      - arxiv
      - duckduckgo images
      - google images

general:
  instance_name: "Local SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  suspended_times:
    SearxEngineAccessDenied: 86400
    SearxEngineCaptcha: 86400
    SearxEngineTooManyRequests: 3600
    cf_SearxEngineCaptcha: 1296000
    cf_SearxEngineAccessDenied: 86400
    recaptcha_SearxEngineCaptcha: 604800
  formats:
    - html
    - json

server:
  # Placeholder only; scripts/local-search injects the owner-only
  # data/searxng_secret_key value at runtime through SEARXNG_SECRET.
  secret_key: ""
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  image_proxy: true

outgoing:
  # Realistic rotating user agents reduce bot-blocks from upstream engines.
  # SearXNG rotates through these per request.
  useragent_suffix: ""
  request_timeout: 5.0
  retries: 0
  pool_connections: 100
  pool_maxsize: 20

engines:
  # Broad indexes verified from this host. The scrape-based engines that were
  # chronically suspended from this home IP (duckduckgo, google cse, startpage,
  # and mojeek) are removed: they only ever contributed a degraded flag. Bing
  # is broker-critical and carries the general-web load; its unavailability
  # triggers broker fallback. Mwmbl is a keyless API-backed independent index.
  # Keep the custom defensive Mwmbl adapter; upstream
  # defaults provide the other implementations.
  - name: bing
    disabled: false
  - name: mwmbl
    engine: mwmbl_safe
    shortcut: mwm
    weight: 0.7
    timeout: 5.0
    disabled: false
  # Focused knowledge and research indexes.
  - name: wikipedia
    disabled: false
  - name: github
    disabled: false
  - name: arxiv
    disabled: false
  # Image engines whose pinned implementations apply moderate SafeSearch.
  # Broker normalization rejects results from every other image engine.
  - name: duckduckgo images
    disabled: false
  - name: google images
    disabled: false
