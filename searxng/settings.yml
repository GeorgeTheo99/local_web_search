use_default_settings: true

general:
  instance_name: "Local SearXNG"

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "en"
  formats:
    - html
    - json

server:
  secret_key: "searxng-local-secret-key-change-me"
  bind_address: "127.0.0.1"
  port: 8888
  limiter: false
  image_proxy: true

outgoing:
  # Realistic rotating user agents reduce bot-blocks from upstream engines.
  # SearXNG rotates through these per request.
  useragent_suffix: ""
  request_timeout: 5.0
  pool_connections: 100
  pool_maxsize: 20

engines:
  # Primary engines — own index or real API, block-resistant for self-hosted.
  - name: brave
    engine: brave
    shortcut: br
    disabled: false
  - name: mwmbl
    engine: mwmbl_safe
    shortcut: mwm
    weight: 0.7
    timeout: 5.0
    disabled: false
  # Failing engines — disabled due to persistent bot blocks / rate limits.
  - name: mojeek      # persistent HTTP 403 from this host
    engine: mojeek
    shortcut: mj
    disabled: true
  - name: google
    engine: google
    shortcut: g
    disabled: true
  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg
    disabled: true
  - name: bing
    engine: bing
    shortcut: b
    disabled: true
  - name: qwant        # rate-limits self-hosted instances under load
    engine: qwant
    shortcut: qw
    disabled: true
  - name: startpage    # Google proxy; blocks self-hosted scrapers
    engine: startpage
    shortcut: sp
    disabled: true
  # Knowledge/research engines — own indexes, never block.
  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
  - name: github
    engine: github
    shortcut: gh
    disabled: false
  - name: arxiv
    engine: arxiv
    shortcut: arx
    disabled: false
