[project]
name = "local-mcp-websearch"
version = "0.1.0"
description = "Local FastMCP websearch broker backed by Brave Search"
requires-python = ">=3.12"
dependencies = [
  "fastmcp>=2.0",
  "httpx>=0.27",
  "readability-lxml>=0.8.4.1,<0.9",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
